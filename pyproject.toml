[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiobjective-network-design"
version = "0.1.0"
description = "Stochastic facility location: cost and disruption resilience"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "pyomo>=6.8,<7", "highspy>=1.7,<2", "plotly>=5.24,<7", "streamlit>=1.50,<2", "matplotlib>=3.8,<4", "pillow>=10,<12"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
network-design = "network_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["network_design*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
